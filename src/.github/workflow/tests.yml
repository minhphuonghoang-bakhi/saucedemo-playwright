name: UI-Tests

# Wann läuft die Pipeline?
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:          # manueller Start über den Button "Run workflow"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven            # Maven-Abhängigkeiten zwischenspeichern → schneller

      - name: Chromium + Systembibliotheken installieren
        run: mvn -B exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Tests ausführen (headless)
        run: mvn -B test -Dheadless=true

      - name: Screenshots und Traces hochladen (nur bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fehler-artefakte
          path: |
            screenshots/
            traces/
          retention-days: 7

      - name: Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: target/surefire-reports/
          retention-days: 7